name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test, Lint & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: TypeScript Typecheck & Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Application (Frontend + Backend Bundle)
        run: npm run build

      - name: Smoke Test Compiled Server
        run: |
          node dist/server.cjs &
          SERVER_PID=$!
          echo "Waiting for server to start..."
          sleep 4
          curl -f http://localhost:3000/api/health || exit 1
          curl -f http://localhost:3000/api/dsh/status || exit 1
          kill $SERVER_PID

